syntax = "proto3";

package greeter.v1;

option go_package = "github.com/tomfitzhenry/go-grpc-peersec/examples/greeter/greeterpb";

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
  string peer_sec = 2;
}

service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply);
}
